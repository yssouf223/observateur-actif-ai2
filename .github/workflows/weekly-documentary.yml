name: Observateur Actif - Documentaire Hebdomadaire

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

jobs:
  build-docu:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🎬 Installation FFmpeg, ImageMagick et Police
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

      - name: 📦 Installation des dépendances
        run: pip install -r requirements.txt

      - name: 🚀 Exécution du pipeline Documentaire
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main_docu.py

      - name: 📤 Sauvegarde de la vidéo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentaire-observateur-actif
          path: output/
          retention-days: 7