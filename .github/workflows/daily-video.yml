name: Observateur Actif - Video Quotidienne

on:
  schedule:
    # Exécution tous les jours à 8h00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'onglet Actions

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Installation de FFmpeg, ImageMagick et Police
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

      - name: 📦 Installation des dépendances Python
        run: pip install -r requirements.txt

      - name: 🚀 Exécution du pipeline de création vidéo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python main.py

      - name: 📤 Sauvegarde de la vidéo en artifact (téléchargeable)
        uses: actions/upload-artifact@v4
        if: always() # Sauvegarde même en cas d'erreur, pour pouvoir analyser les logs
        with:
          name: short-observateur-actif
          path: output/
          retention-days: 7