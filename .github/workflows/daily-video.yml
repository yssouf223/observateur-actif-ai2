name: Observateur Actif - Video Quotidienne

on:
  schedule:
    - cron: '0 8 * * *' # Tous les jours à 8h00 UTC
  workflow_dispatch: # Pour lancer manuellement

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Installation de FFmpeg, ImageMagick et Police
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

      - name: 📦 Installation des dépendances Python
        run: pip install -r requirements.txt

      - name: 🚀 Exécution du pipeline de création vidéo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: 📤 Sauvegarde de la vidéo en artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-observateur-actif
          path: output/
          retention-days: 7